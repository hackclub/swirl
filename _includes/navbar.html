<nav class="navbar">
  <a class="banner" href="https://hackclub.com/">
    <img src="https://assets.hackclub.com/flag-orpheus-top.svg" alt="Hack Club" />
  </a>
  <div class="navbar__container">
    <button
      class="navbar__toggle"
      aria-label="Toggle menu"
      aria-expanded="false"
      aria-controls="navbar-menu"
    >
      <span></span><span></span><span></span>
    </button>
    <ul class="navbar__menu" id="navbar-menu">
      {%- for link in site.data.nav.links %}
      <li class="navbar__item">
        <a
          href="{{ link.url | relative_url }}"
          class="navbar__links"
          {%- if page.url == link.url %} aria-current="page"{% endif %}
          >{{ link.title }}</a
        >
      </li>
      {%- endfor %}
      <li class="navbar__submit-item">
        <a href="{{ site.data.nav.submit.url }}" class="navbar__btn"
          >{{ site.data.nav.submit.title }}</a
        >
      </li>
    </ul>
  </div>
</nav>

<script>
  (function () {
    var toggle = document.querySelector('.navbar__toggle');
    var menu = document.getElementById('navbar-menu');
    if (!toggle || !menu) return;
    toggle.addEventListener('click', function () {
      var open = menu.classList.toggle('is-open');
      toggle.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    menu.addEventListener('click', function (e) {
      if (e.target.closest('a')) {
        menu.classList.remove('is-open');
        toggle.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>
